<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Chat - Ruang Diskusi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-main: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border: #334155; --accent: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: radial-gradient(circle at top left, #1e1b4b, #0f172a); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        
        /* Layar Setup Kelas */
        .setup-card { width: 100%; max-width: 460px; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); text-align: center; }
        .node-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border); padding: 8px 16px; border-radius: 99px; font-size: 12px; color: var(--text-muted); margin-bottom: 24px; }
        .brand-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 14px; display: inline-flex; justify-content: center; align-items: center; color: #fff; margin-bottom: 16px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        select, input[type="text"] { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 14px; outline: none; margin-bottom: 10px;}
        .btn-primary { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn-outline { width: 100%; background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        
        /* Layar Chat (Tersembunyi di awal) */
        #chat-screen { display: none; width: 100%; max-width: 800px; height: 80vh; background-color: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; flex-direction: column; }
        .chat-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #1e1b4b; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 14px; }
        .msg-mine { background: #3b82f6; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-other { background: #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-sender { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 4px; display: block; }
        .chat-input-area { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
        .chat-input-area input { margin-bottom: 0; flex: 1; }
    </style>
</head>
<body>

    <!-- SCREEN 1: PILIH KELAS -->
    <div id="setup-screen" class="setup-card">
        <div class="node-badge">Distributed Node #3 — Group Chat (Port 3003)</div>
        <div class="brand-icon"><i data-lucide="users"></i></div>
        <h1 style="font-size: 24px; margin-bottom: 6px;">Ruang Diskusi</h1>
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 32px;" id="greeting-text">Memverifikasi Auth...</p>

        <div class="input-group">
            <label>Pilih Ruang Kelas (Permanen)</label>
            <select id="room-select">
                <option value="">-- Memuat Kelas... --</option>
            </select>
            <button class="btn-outline" onclick="buatKelasBaru()">+ Buat Kelas Baru</button>
        </div>

        <button class="btn-primary" onclick="gabungKelas()">
            Gabung Ruangan <i data-lucide="arrow-right" style="width:18px;"></i>
        </button>
    </div>

    <!-- SCREEN 2: CHAT AREA -->
    <div id="chat-screen">
        <div class="chat-header">
            <div>
                <h2 id="room-title" style="font-size: 18px;">Nama Kelas</h2>
                <span id="user-identity" style="font-size: 12px; color: #94a3b8;">Login sebagai: -</span>
            </div>
            <button class="btn-outline" style="width: auto; padding: 6px 12px;" onclick="location.reload()">Keluar</button>
        </div>
        <div class="chat-messages" id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ketik pesan..." onkeypress="handleEnter(event)">
            <button class="btn-primary" style="width: auto; margin-top:0;" onclick="kirimPesan()">Kirim <i data-lucide="send" style="width:16px;"></i></button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let socket;
        let activeRoom = "";
        
        // 1. INTEGRASI AUTHENTICATION DARI PORT 3001
        const token = localStorage.getItem('token');
        if (!token) {
            alert("⚠️ Akses Ditolak! Anda belum login.\nSistem akan mengarahkan ke Auth Service (Port 3001).");
            window.location.href = "http://localhost:3001"; // Redirect paksa ke Auth Service
        }

        // Dekode manual payload JWT untuk ambil Username di Frontend
        const payloadBase64 = token.split('.')[1];
        const decodedPayload = JSON.parse(atob(payloadBase64));
        const myUsername = decodedPayload.username;
        document.getElementById('greeting-text').innerText = `Selamat datang, ${myUsername}!`;
        document.getElementById('user-identity').innerText = `Login sebagai: ${myUsername}`;

        // 2. MUAT DAFTAR KELAS PERMANEN DARI DATABASE
        async function loadRooms() {
            try {
                const res = await fetch('/api/rooms');
                const rooms = await res.json();
                const select = document.getElementById('room-select');
                select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
                rooms.forEach(r => {
                    select.innerHTML += `<option value="${r.name}">${r.name}</option>`;
                });
            } catch (err) {
                console.error("Gagal memuat kelas");
            }
        }
        loadRooms(); // Eksekusi saat web dibuka

        // 3. FITUR BUAT KELAS BARU
        async function buatKelasBaru() {
            const newRoom = prompt("Masukkan nama Ruang Kelas baru:");
            if (newRoom) {
                await fetch('/api/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomName: newRoom })
                });
                loadRooms(); // Reload dropdown
                alert("Kelas berhasil dibuat dan tersimpan permanen di Cloud!");
            }
        }

        // 4. LOGIKA GABUNG DAN SOCKET.IO
        function gabungKelas() {
            const select = document.getElementById('room-select');
            activeRoom = select.value;
            if (!activeRoom) return alert("Pilih kelas terlebih dahulu!");

            // Inisialisasi Socket dengan menyertakan Token
            socket = io({ auth: { token: token } });

            // Error Handling jika token palsu/kadaluarsa
            socket.on("connect_error", (err) => {
                alert(err.message);
                window.location.href = "http://localhost:3001";
            });

            socket.on('connect', () => {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('room-title').innerText = `Kelas: ${activeRoom}`;
                
                // Minta bergabung ke room
                socket.emit('join_room', activeRoom);
            });

            // Menerima Riwayat Chat dari Database
            socket.on('load_group_history', (history) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = ''; // Bersihkan loading
                history.forEach(msg => appendMessage(msg.sender, msg.message));
            });

            // Menerima Pesan Realtime Baru
            socket.on('receive_group_message', (data) => {
                appendMessage(data.sender, data.message);
            });

            socket.on('system_notification', (msg) => {
                const box = document.getElementById('chat-box');
                box.innerHTML += `<div style="text-align:center; font-size:12px; color:#94a3b8;">-- ${msg} --</div>`;
            });
        }

        function kirimPesan() {
            const input = document.getElementById('chat-input');
            const pesan = input.value.trim();
            if (!pesan) return;

            socket.emit('send_group_message', { room: activeRoom, message: pesan });
            appendMessage(myUsername, pesan); // Tampilkan di layar sendiri
            input.value = '';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') kirimPesan();
        }

        function appendMessage(sender, text) {
            const box = document.getElementById('chat-box');
            const isMine = sender === myUsername;
            const bubbleClass = isMine ? 'msg-mine' : 'msg-other';
            
            box.innerHTML += `
                <div class="msg-bubble ${bubbleClass}">
                    ${!isMine ? `<span class="msg-sender">${sender}</span>` : ''}
                    ${text}
                </div>
            `;
            box.scrollTop = box.scrollHeight; // Auto scroll ke bawah
        }
    </script>
</body>
</html>
