<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Chat (Anggota 2) - Campus Chat App</title>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Socket.io Client CDN -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --accent: #3b82f6;
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
            --chat-bg: #090d16;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .node-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
        }

        .chat-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .terminal-section {
            margin-top: 24px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .terminal-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #kotakMasuk {
            background-color: var(--chat-bg);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            height: 220px;
            overflow-y: auto;
            list-style: none;
        }

        .chat-message {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border);
            word-wrap: break-word;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="node-badge">
        <span class="status-dot"></span>
        <span>Distributed Node #2 — <strong>Personal Chat (Port 3002)</strong></span>
    </div>

    <!-- Section 1: Form Verifikasi Auth -->
    <div class="auth-card" id="formLoginChat">
        <div class="brand-header">
            <div class="brand-icon">
                <i data-lucide="shield-check"></i>
            </div>
            <h1>Personal Chat Gateway</h1>
            <p>Validasi Kredensial via Auth Service (Port 3001)</p>
        </div>

        <div class="input-group">
            <label for="namaSaya">Username / NIM Terdaftar</label>
            <div class="input-wrapper">
                <i data-lucide="user"></i>
                <input type="text" id="namaSaya" placeholder="Masukkan username yang sudah diregister">
            </div>
        </div>

        <div class="input-group">
            <label for="passSaya">Kata Sandi Akun</label>
            <div class="input-wrapper">
                <i data-lucide="lock"></i>
                <input type="password" id="passSaya" placeholder="••••••••">
            </div>
        </div>

        <button class="btn btn-primary" onclick="verifikasiDanMasuk()">
            <i data-lucide="log-in" style="width:16px;"></i> Verifikasi & Masuk Jaringan
        </button>
    </div>

    <!-- Section 2: Area Chatting -->
    <div class="auth-card" id="areaChat" style="display:none; max-width: 550px;">
        <div class="brand-header" style="margin-bottom: 24px;">
            <h2 style="font-size: 18px; color: var(--success); display:flex; justify-content:center; align-items:center; gap:8px;">
                <i data-lucide="wifi"></i> Autentikasi Berhasil
            </h2>
            <p id="statusUser" style="font-size: 13px; margin-top: 4px;"></p>
        </div>

        <div class="chat-grid">
            <div class="input-group" style="margin-bottom: 0;">
                <label for="namaTeman">Penerima</label>
                <div class="input-wrapper">
                    <i data-lucide="at-sign"></i>
                    <input type="text" id="namaTeman" placeholder="Nama target" onchange="muatRiwayatChat()">
                </div>
            </div>
            <div class="input-group" style="margin-bottom: 0;">
                <label for="isiPesan">Isi Pesan</label>
                <div class="input-wrapper">
                    <i data-lucide="send"></i>
                    <input type="text" id="isiPesan" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
                </div>
            </div>
        </div>

        <button class="btn btn-primary" onclick="kirimPesan()">
            Kirim Pesan <i data-lucide="arrow-right" style="width:16px;"></i>
        </button>

        <!-- Kotak Masuk / Terminal Log -->
        <div class="terminal-section">
            <div class="terminal-header">
                <span class="terminal-title">
                    <i data-lucide="database" style="width:14px;"></i> Riwayat Chat (MongoDB Atlas)
                </span>
            </div>
            <ul id="kotakMasuk">
                <li style="color: var(--text-muted); font-style: italic; font-size: 12px; border:none;">[Sistem] Ketik nama penerima untuk memuat percakapan...</li>
            </ul>
        </div>
    </div>

    <div class="footer-text">
        Project Sistem Terdistribusi Kelompok • 2026
    </div>

    <script>
        lucide.createIcons();

        const socket = io(`http://${window.location.hostname}:3002`); 
        let namaSaya = "";

        // Fungsi IPI: Mengecek ke Auth Service (Port 3001) apakah user terdaftar
        async function verifikasiDanMasuk() {
            const usernameInput = document.getElementById("namaSaya").value.trim();
            const passwordInput = document.getElementById("passSaya").value.trim();

            if (!usernameInput || !passwordInput) {
                alert("Username dan Password tidak boleh kosong!");
                return;
            }

            try {
                // Melakukan request inter-service / inter-process ke Auth Service (Port 3001) milik Anggota 1
                const response = await fetch(`http://${window.location.hostname}:3001/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (response.ok) {
                    // Jika terdaftar di Auth Service, izinkan masuk ke Socket Chat
                    namaSaya = usernameInput;
                    socket.emit("register_user", namaSaya);

                    document.getElementById("formLoginChat").style.display = "none";
                    document.getElementById("areaChat").style.display = "block";
                    document.getElementById("statusUser").innerText = `Login Terverifikasi sebagai: ${namaSaya}`;
                } else {
                    // Jika gagal atau belum register
                    alert("Akses Ditolak: " + (result.message || "Username belum terdaftar di Auth Service atau password salah!"));
                }
            } catch (err) {
                alert("Gagal terhubung ke Auth Service (Port 3001). Pastikan server Anggota 1 sedang menyala!");
            }
        }

        function muatRiwayatChat() {
            const namaTeman = document.getElementById("namaTeman").value.trim();
            if (namaSaya && namaTeman) {
                socket.emit("get_chat_history", { pengirim: namaSaya, penerima: namaTeman });
            }
        }

        function kirimPesan() {
            const namaTeman = document.getElementById("namaTeman").value.trim();
            const pesan = document.getElementById("isiPesan").value.trim();

            if(!namaTeman || !pesan) return;

            socket.emit("private_message", {
                pengirim: namaSaya,
                penerima: namaTeman,
                pesan: pesan
            });

            document.getElementById("isiPesan").value = ""; 
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                kirimPesan();
            }
        }

        function tambahPesanKeLayar(pengirim, pesan, isSelf = false) {
            const listPesan = document.getElementById("kotakMasuk");
            
            if(listPesan.children.length > 0 && listPesan.children[0].innerText.includes("[Sistem]")) {
                listPesan.innerHTML = "";
            }

            const li = document.createElement("li");
            li.className = "chat-message";
            
            const color = isSelf ? "var(--success)" : "#38bdf8";
            const label = isSelf ? "Kamu" : pengirim;
            
            li.innerHTML = `<span style="color: ${color}; font-weight:bold;">[${label}]</span>: ${pesan}`;
            
            listPesan.appendChild(li);
            listPesan.scrollTop = listPesan.scrollHeight;
        }

        socket.on("pesan_terkirim", (data) => {
            const namaTeman = document.getElementById("namaTeman").value.trim();
            if (data.penerima === namaTeman) {
                tambahPesanKeLayar(data.pengirim, data.pesan, true);
            }
        });

        socket.on("terima_pesan", (data) => {
            const namaTeman = document.getElementById("namaTeman").value.trim();
            if (data.pengirim === namaTeman) {
                tambahPesanKeLayar(data.pengirim, data.pesan, false);
            }
        });

        socket.on("load_chat_history", (history) => {
            const listPesan = document.getElementById("kotakMasuk");
            listPesan.innerHTML = "";

            if (history.length === 0) {
                listPesan.innerHTML = `<li style="color: var(--text-muted); font-style: italic; font-size: 12px; border:none;">Belum ada riwayat pesan dengan user ini.</li>`;
                return;
            }

            history.forEach(item => {
                const isSelf = item.pengirim === namaSaya;
                tambahPesanKeLayar(item.pengirim, item.pesan, isSelf);
            });
        });

        socket.on("error_message", (pesanError) => {
            alert("Sistem Peringatan: " + pesanError);
        });
    </script>
</body>
</html>
