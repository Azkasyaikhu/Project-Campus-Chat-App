<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Chat App - Auth Gateway</title>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #1e3a8a;       /* Campus Navy */
            --primary-hover: #1e40af;
            --accent: #3b82f6;        /* Electric Blue */
            --bg-main: #0f172a;       /* Dark slate background */
            --card-bg: #1e293b;       /* Card background */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Top Bar Info Node */
        .node-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Main Container */
        .auth-card {
            width: 100%;
            max-width: 460px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Input Styles */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Buttons */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        /* Terminal Logs Section */
        .terminal-section {
            margin-top: 32px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .terminal-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .response-status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            display: none;
        }

        .response-status.success {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: inline-block;
        }

        .response-status.error {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: inline-block;
        }

        pre {
            background-color: #090d16;
            border: 1px solid #1e293b;
            color: #38bdf8;
            padding: 14px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            overflow-x: auto;
            max-height: 180px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <!-- Distributed Node Header -->
    <div class="node-badge">
        <span class="status-dot"></span>
        <span>Distributed Node #1 — <strong>Auth Gateway (Port 3001)</strong></span>
    </div>

    <!-- Main Auth Card -->
    <div class="auth-card">
        <div class="brand-header">
            <div class="brand-icon">
                <i data-lucide="graduation-cap"></i>
            </div>
            <h1>Campus Chat App</h1>
            <p>Sistem Terdistribusi — Layanan Autentikasi</p>
        </div>

        <form id="auth-form" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="username">NIM / Username Kredensial</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="actions-grid">
                <button type="button" class="btn btn-secondary" onclick="register(event)">
                    <i data-lucide="user-plus" style="width:16px;"></i> Register
                </button>
                <button type="button" class="btn btn-primary" onclick="login(event)">
                    <i data-lucide="log-in" style="width:16px;"></i> Login
                </button>
            </div>
        </form>

        <!-- System Output Log -->
        <div class="terminal-section">
            <div class="terminal-header">
                <span class="terminal-title">
                    <i data-lucide="terminal" style="width:14px;"></i> Payload Response
                </span>
                <span id="response-status" class="response-status"></span>
            </div>
            <pre id="output">// Menunggu interaksi dari Klien...</pre>
        </div>
    </div>

    <div class="footer-text">
        Project Sistem Terdistribusi Kelompok • 2026
    </div>

    <script>
        // Inisialisasi Ikon Lucide
        lucide.createIcons();

        // Menggunakan Hostname dinamis agar menyesuaikan dengan IP Server
        const API_URL = `http://${window.location.hostname}:3001/api`;

        function updateTerminal(data, isSuccess, statusCode) {
            const outputElem = document.getElementById('output');
            const statusElem = document.getElementById('response-status');

            outputElem.innerText = JSON.stringify(data, null, 2);

            if (isSuccess) {
                statusElem.className = 'response-status success';
                statusElem.innerText = `HTTP ${statusCode || 200} OK`;
            } else {
                statusElem.className = 'response-status error';
                statusElem.innerText = `HTTP ${statusCode || 'ERROR'}`;
            }
        }

        async function register(e) {
            if (e) e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            if (!usernameInput || !passwordInput) {
                updateTerminal({ error: "Username dan Password tidak boleh kosong!" }, false, 400);
                return;
            }

            document.getElementById('output').innerText = "// Mengirimkan payload register ke Server...";

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });
                
                const data = await res.json();
                updateTerminal(data, res.ok, res.status);
            } catch (err) {
                updateTerminal({ 
                    error: "Gagal terhubung ke Auth Node (Port 3001)",
                    detail: err.message 
                }, false);
            }
        }

        async function login(e) {
            if (e) e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            if (!usernameInput || !passwordInput) {
                updateTerminal({ error: "Username dan Password tidak boleh kosong!" }, false, 400);
                return;
            }

            document.getElementById('output').innerText = "// Verifikasi kredensial login...";

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });
                
                const data = await res.json();
                updateTerminal(data, res.ok, res.status);

                // [PERBAIKAN DI SINI]: Jika ada token, simpan dan langsung pindah ke port 3003
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    
                    // Tambahkan teks notifikasi pengalihan di terminal UI
                    document.getElementById('output').innerText += "\n\n// Login Sukses! Mengalihkan ke Ruang Diskusi (Port 3003)...";
                    
                    // Pindah otomatis ke Port 3003 setelah jeda 1.5 detik
                    setTimeout(() => {
                        window.location.href = `http://${window.location.hostname}:3003`;
                    }, 1500);
                }
            } catch (err) {
                updateTerminal({ 
                    error: "Gagal terhubung ke Auth Node (Port 3001)",
                    detail: err.message 
                }, false);
            }
        }
    </script>
</body>
</html>
